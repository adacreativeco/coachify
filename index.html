<html lang="tr" class="dark">

    <meta charset="UTF-8" />

    <title>COACHIFY.OS — AI-Powered Football & Sports Academy Management Operating System</title>
    <meta name="description" content="Sahadaki taktikten kulüp finansına kadar profesyonel futbol kulüpleri ve akademiler için yeni nesil yapay zeka işletim sistemi." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
